apply plugin: 'com.android.application'

android {
    namespace 'ai.leadzio.paysync'
    compileSdk 34

    defaultConfig {
        applicationId "ai.leadzio.paysync"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
